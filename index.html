<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainBox - Web Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav">
      <a class="logo" href="#">BrainBox<span>.</span></a>
      <a class="back" href="../index.html">All projects</a>
    </div>
  </header>

  <main>
    <h1 class="heading">Web Basics <span>Quiz</span></h1>

    <div class="card quiz-card">
      <div class="card-inner">

        <div id="quizBox">
          <div class="top-line">
            <span id="qNumber"></span>
            <span id="scoreText"></span>
          </div>
          <div class="progress"><div id="progressFill"></div></div>

          <h2 id="question"></h2>
          <div id="options"></div>

          <button id="nextBtn" class="next-btn" disabled>Next question</button>
        </div>

        <div id="resultBox" class="hidden">
          <h2>Quiz finished</h2>
          <div class="final-score" id="finalScore"></div>
          <p id="finalMessage"></p>
          <button id="restartBtn" class="next-btn">Try again</button>
        </div>

      </div>
    </div>
  </main>

  <footer>Web Technologies project – HTML, CSS and JavaScript</footer>
  <script src="script.js"></script>
</body>
</html>
